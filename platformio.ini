; Screensemble Batton — ESP32 cue device.
; Copy include/config.h.example → include/config.h and fill it in
; before `pio run -t upload`.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson@^7.2.0

; Default app partition (1.3MB) is ~97% full — huge_app gives ~3MB.
board_build.partitions = huge_app.csv
